<body>
    <div class="auth">
    <div class="auth-form">
        <a href="index.html" class="back muted small" style="display:inline-flex;gap:.3rem;align-items:center"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
 Volver al inicio</a>
        <div class="inner">
            <h1>Hola de nuevo</h1>
            <p class="lede">Ingresa para ver tus citas o tu agenda del día.</p>
            <form method="POST" action="ingresar.html" data-demo-action="login" class="stack">
                                <div class="field ">
    <label for="f-email">Correo</label>
            <input id="f-email" type="email" name="email" value="" class="input" autocomplete="email" autofocus="autofocus"  required>
            </div>
                <div class="field ">
    <label for="f-password">Contraseña</label>
            <input id="f-password" type="password" name="password" value="" class="input" autocomplete="current-password"  required>
            </div>
                <label class="check"><input type="checkbox" name="recordar" value="1"> Mantener la sesión en este equipo</label>
                <button class="btn btn-primary btn-lg w-full mt-1">Ingresar</button>
                <p class="muted small" style="text-align:center">¿Primera vez? <a class="link" href="registro.html">Crea tu cuenta de paciente</a></p>

                                <div class="demo-accounts">
                    <p style="margin-bottom:.4rem">Cuentas de prueba (contraseña <b>password</b>):</p>
                    <button type="button" data-demo="admin@tovelmedical.com"><b>Administración</b><span>admin@tovelmedical.com</span></button>
                    <button type="button" data-demo="doctor@tovelmedical.com"><b>Doctor</b><span>doctor@tovelmedical.com</span></button>
                    <button type="button" data-demo="paciente@tovelmedical.com"><b>Paciente</b><span>paciente@tovelmedical.com</span></button>
                </div>
                            </form>
        </div>
    </div>
    <figure class="auth-art" aria-hidden="true">
    <a href="index.html" class="brand" style="color:#fff;padding:0">
        <span class="brand-mark" style="background:#F0A64C;color:#2A1A05"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        TovelMedical
    </a>
    <div class="ticket-stack">
        <div class="slot"><b>08:30</b><span>Medicina general</span></div>
        <div class="slot" aria-pressed="true"><b>09:00</b><span>Tu cita, Consultorio 101</span></div>
        <div class="slot"><b>09:30</b><span>Pediatría</span></div>
    </div>
    <div>
        <blockquote>Elige la hora que te sirve. Nosotros nos encargamos del resto.</blockquote>
        <figcaption>Reserva, cancela y revisa tus consultas desde el celular.</figcaption>
    </div>
</figure>
</div>
    <div id="toasts" class="toasts" role="region" aria-label="Notificaciones"></div>
    <div id="anuncios" class="sr-only" aria-live="polite"></div>
