<!DOCTYPE html>
<html lang="es" data-demo-root="./" data-demo-cita="144">
<head>
    <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>try{document.querySelector('meta[name="color-scheme"]').content=localStorage.getItem('color-scheme')??'light dark'}catch(e){}</script>
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1412" media="(prefers-color-scheme: dark)">

<meta name="description" content="Reserva tu cita médica en línea en TovelMedical: elige especialidad, doctor y hora en un minuto.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=bricolage-grotesque:500,600,700|instrument-sans:400,500,600,700&display=swap" rel="stylesheet">
<link rel="preload" as="style" href="build/assets/app-DmvEGFLJ.css" /><link rel="modulepreload" href="build/assets/app-BYjgg4Tf.js" /><link rel="stylesheet" href="build/assets/app-DmvEGFLJ.css" /><script type="module" src="build/assets/app-BYjgg4Tf.js"></script>    <title>Crear cuenta · TovelMedical</title>
<link rel="stylesheet" href="./demo.css">
<script src="./demo.js"></script>
<meta name="robots" content="noindex">
</head>
<body>
    <div class="auth">
    <div class="auth-form">
        <a href="index.html" class="back muted small" style="display:inline-flex;gap:.3rem;align-items:center"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
 Volver al inicio</a>
        <div class="inner">
            <h1>Crea tu cuenta</h1>
            <p class="lede">Con tu cuenta reservas en un minuto y tienes tus consultas siempre a mano.</p>
            <form method="POST" action="registro.html" data-demo-action="registro" class="stack">
                                <div class="field ">
    <label for="f-name">Nombre completo</label>
            <input id="f-name" type="text" name="name" value="" class="input" autocomplete="name"  required>
            </div>
                <div class="form-grid">
                    <div class="field ">
    <label for="f-cedula">Cédula</label>
            <input id="f-cedula" type="text" name="cedula" value="" class="input" inputmode="numeric" maxlength="10" pattern="\d{10}" autocomplete="off"  required>
            </div>
                    <div class="field ">
    <label for="f-telefono">Celular</label>
            <input id="f-telefono" type="tel" name="telefono" value="" class="input" autocomplete="tel" placeholder="09…"  required>
            </div>
                </div>
                <div class="field ">
    <label for="f-email">Correo</label>
            <input id="f-email" type="email" name="email" value="" class="input" autocomplete="email"  required>
            </div>
                <div class="form-grid">
                    <div class="field ">
    <label for="f-password">Contraseña</label>
            <input id="f-password" type="password" name="password" value="" class="input" autocomplete="new-password"  required>
        <span class="hint">Mínimo 8 caracteres.</span>    </div>
                    <div class="field ">
    <label for="f-password_confirmation">Repite la contraseña</label>
            <input id="f-password_confirmation" type="password" name="password_confirmation" value="" class="input" autocomplete="new-password"  required>
            </div>
                </div>
                <button class="btn btn-primary btn-lg w-full mt-1">Crear cuenta</button>
                <p class="muted small" style="text-align:center">¿Ya tienes cuenta? <a class="link" href="ingresar.html">Ingresa</a></p>
            </form>
        </div>
    </div>
    <figure class="auth-art" aria-hidden="true">
    <a href="index.html" class="brand" style="color:#fff;padding:0">
        <span class="brand-mark" style="background:#F0A64C;color:#2A1A05"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        TovelMedical
    </a>
    <div class="ticket-stack">
        <div class="slot"><b>08:30</b><span>Medicina general</span></div>
        <div class="slot" aria-pressed="true"><b>09:00</b><span>Tu cita, Consultorio 101</span></div>
        <div class="slot"><b>09:30</b><span>Pediatría</span></div>
    </div>
    <div>
        <blockquote>Elige la hora que te sirve. Nosotros nos encargamos del resto.</blockquote>
        <figcaption>Reserva, cancela y revisa tus consultas desde el celular.</figcaption>
    </div>
</figure>
</div>
    <div id="toasts" class="toasts" role="region" aria-label="Notificaciones"></div>
    <div id="anuncios" class="sr-only" aria-live="polite"></div>
    </body>
</html>
